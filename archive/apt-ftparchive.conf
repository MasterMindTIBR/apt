// Campos do Release de dists/trixie (apt-ftparchive release).
// Usado por scripts/build-repo.sh. Sem Valid-Until de propósito: se o
// publish parar, os nodes continuam aceitando o último índice assinado.
APT::FTPArchive::Release {
  Origin "MasterMind";
  Label "MasterMind";
  Suite "trixie";
  Codename "trixie";
  Architectures "amd64";
  Components "stable testing";
  Description "Pacotes da MasterMind TI para Proxmox VE 9 e Debian 13";
  // Só SHA-256 e SHA-512 (o apt do Debian 13 ignora MD5 e SHA-1).
  MD5 "false";
  SHA1 "false";
};
